title: Asahina'"'"'s Blog
email: 1811369773@qq.com
description: >- # this means to ignore newlines until "baseurl:"
  个人博客分享技术心得与生活感悟
baseurl: "/Asahina.github.io"
url: "https://ironi-2.github.io"
author: Ash
twitter_username: ash
github_username: Ironi-2

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: katex
  math_engine_opts:
    display_mode: true

# Cache directory
cache_dir: "C:/Temp/jekyll-cache"

# Encoding
encoding: utf-8

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE.md

# Graph Generator
graph_enabled: true

# Default author
default_author:
  name: "Zhen"
  bio: "热爱编程技术，记录学习与思考"
  avatar: "/assets/images/author1.png"
  github: "Ironi-2"
  email: "1811369773@qq.com"
  twitter: "ash"
