<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "zh-CN" }}">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 标题与描述由 jekyll-seo-tag 统一生成，此处不再手写，避免重复标签 -->

  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="icon" href="{{ "/assets/images/favicon.ico" | relative_url }}">

  {% seo %}

<!-- KaTeX 数学公式渲染（去掉 integrity，避免哈希不匹配） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
  function renderMath() {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [
          {left: "$$", right: "$$", display: true},
          {left: "$", right: "$", display: false},
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ],
        throwOnError: false,
        strict: false
      });
    } else {
      setTimeout(renderMath, 50);
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderMath);
  } else {
    renderMath();
  }
</script>

<!-- D3.js for Knowledge Graph (only on graph page) -->
{% if page.url == "/graph/" or page.url == "/Asahina.github.io/graph/" %}
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>
{% endif %}
</head>

<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>

  {% include header.html %}

  <main id="main-content" class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <script src="{{ "/assets/js/main.js" | relative_url }}"></script>

  <!-- Graph JS (only on graph page) -->
  {% if page.url == "/graph/" or page.url == "/Asahina.github.io/graph/" %}
  <script src="{{ "/assets/js/graph.js" | relative_url }}"></script>
  {% endif %}
</body>

</html>
